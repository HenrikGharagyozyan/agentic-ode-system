[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ode"
version = "0.2.0"
description = "A four-role LangGraph system (orchestrator, scientist, general, executor) that fits and tests ODE models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langchain>=1.4",
    "langchain-openai>=1.7",
    "langchain-core>=1.6",
    "python-dotenv>=1.0",
    "pydantic>=2",
    # used by the scripts the executor writes and runs
    "numpy",
    "scipy",
    "torch",
    # graph diagram in the report
    "matplotlib",
    # HW3: the event camera MCP server, and its client for the agent (agentic_ode/mcp_client.py; not
    # langchain-mcp-adapters: no release works with mcp 2.x, which fastmcp 4 needs)
    "fastmcp>=4.1",
    # HW3: hw_decide checks camera tool arguments against the tool's JSON schema before the approval question
    "jsonschema>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
agentic-ode = "agentic_ode.cli:main"

[tool.setuptools.packages.find]
include = ["agentic_ode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# prompt text and the HTML template keep their exact wording and layout
"agentic_ode/agents/prompts.py" = ["E501"]
"agentic_ode/reporting/builder.py" = ["E501"]
